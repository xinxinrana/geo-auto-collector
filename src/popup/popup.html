<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEO 自动采集</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>GEO 自动采集</h1>
    <span id="version"></span>
  </header>

  <section id="input-section">
    <label for="keywords">关键词 / 提示词（一行一个）</label>
    <textarea id="keywords" rows="6" placeholder="每行一个关键词，支持粘贴多条"></textarea>

    <label>检测平台</label>
    <div id="platforms" class="platform-list">
      <label class="platform"><input type="checkbox" value="perplexity" checked /> Perplexity</label>
      <label class="platform"><input type="checkbox" value="chatgpt" /> ChatGPT</label>
      <label class="platform"><input type="checkbox" value="gemini" /> Gemini</label>
      <label class="platform"><input type="checkbox" value="claude" /> Claude</label>
      <label class="platform"><input type="checkbox" value="doubao" /> 豆包</label>
      <label class="platform"><input type="checkbox" value="yuanbao" /> 元宝</label>
      <label class="platform"><input type="checkbox" value="kimi" /> Kimi</label>
    </div>
  </section>

  <section id="controls">
    <button id="start-btn" class="primary">开始检测</button>
    <button id="stop-btn" class="danger" disabled>停止</button>
  </section>

  <section id="controls-secondary">
    <button id="collect-btn">采集当前页面</button>
    <button id="export-btn">导出当前会话</button>
  </section>

  <section id="selector-config-section">
    <button id="open-console-btn">打开平台控制台 · 元素配置与试运行</button>
  </section>

  <section id="progress-section" hidden>
    <div class="progress-head">
      <span id="progress-label">准备中…</span>
      <span id="progress-count">0 / 0</span>
    </div>
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <ul id="task-log"></ul>
  </section>

  <section id="sessions-section">
    <div class="sessions-head">
      <label>采集会话</label>
      <button id="new-session-btn" class="mini">＋ 新建会话</button>
    </div>
    <div id="sessions"></div>
  </section>

  <footer>
    <small>结果仅用于个人 GEO 检测。请合理设置间隔，避免触发平台风控。</small>
  </footer>

  <script src="../lib/jszip.min.js"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
