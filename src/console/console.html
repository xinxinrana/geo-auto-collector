<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>平台控制台 · GEO 自动采集</title>
  <link rel="stylesheet" href="console.css" />
</head>
<body>
  <header>
    <span class="eyebrow">GEO 自动采集</span>
    <h1>平台控制台</h1>
    <p>调整一个平台的元素，在网页点选并试运行，再保存应用。</p>
  </header>

  <main>
    <section class="panel">
      <div class="section-heading"><h2>选择平台</h2><button id="add-toggle" class="text-button">＋ 新增</button></div>
      <select id="platform-select" aria-label="选择平台"></select>
      <p id="platform-url" class="hint"></p>
      <div class="actions"><button id="open-platform">打开平台页面</button><button id="delete-platform" class="danger-outline" hidden>移除平台</button></div>
      <form id="add-form" hidden>
        <label for="new-name">平台名称</label><input id="new-name" maxlength="50" placeholder="例如：新的 AI 平台" required />
        <label for="new-url">新聊天页地址</label><input id="new-url" type="url" placeholder="https://example.com/chat/new" required />
        <p class="hint">新增后在该平台网页中点选元素，并试运行确认可用。</p>
        <div class="actions"><button class="primary" type="submit">添加平台</button><button id="add-cancel" type="button">取消</button></div>
      </form>
    </section>

    <section class="panel">
      <div class="section-heading"><h2>元素配置</h2><span id="config-state" class="badge">读取中</span></div>
      <p class="hint">点击“网页点选”后在目标页面选择；提示和取消入口留在侧边栏，网页上仅高亮鼠标所指元素。也可以直接修改选择器；未设置的字段使用平台内置规则。</p>
      <div id="element-fields"></div>
      <details class="advanced"><summary>发送按钮（可选）</summary><div id="send-field"></div><p class="hint">自定义平台未设置时会尝试表单提交或 Enter。</p></details>
      <div class="actions"><button id="save-config" class="primary">保存并应用</button><button id="reset-platform">恢复内置</button></div>
      <p id="save-feedback" class="feedback" role="status"></p>
    </section>

    <section class="panel">
      <div class="section-heading"><h2>试运行</h2><span class="hint">仅当前平台 · 不计入采集会话</span></div>
      <label for="test-keyword">测试提示词</label>
      <textarea id="test-keyword" rows="3" placeholder="输入一条测试提示词"></textarea>
      <button id="run-test" class="primary wide">运行一次</button>
      <div id="test-result" class="test-result" role="status">尚未试运行。试运行使用上方编辑中的配置。</div>
    </section>
  </main>

  <script src="console.js" type="module"></script>
</body>
</html>
